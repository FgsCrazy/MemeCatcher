/* ---------- Host ---------- */
async function createHost(profile){
  let peer = null, code = null;
  for (let i = 0; i < 4 && !peer; i++) {
    code = makeCode();
    try { peer = await openPeer(peerIdFor(code)); }
    catch (e) { if (e.type !== 'unavailable-id') throw new Error('Raum konnte nicht erstellt werden: ' + (e.message || e.type)); }
  }
  if (!peer) throw new Error('Raum konnte nicht erstellt werden. Bitte nochmal versuchen.');
  Object.assign(NET, { role: 'host', peer, code, conns: new Map(), players: [{ id: 'host', ...profile }] });
  NET.settings.rounds = clamp(NET.settings.rounds, 1, clips.length);
  peer.on('connection', conn => {
    conn.on('data', m => hostOnData(conn, m));
    conn.on('close', () => hostDrop(conn.peer));
    conn.on('error', () => hostDrop(conn.peer));
  });
  peer.on('disconnected', () => { try { peer.reconnect(); } catch {} });
  hostLobby();
}
function hostSend(msg){
  for (const c of NET.conns.values()) if (c.open) { try { c.send(msg); } catch (e) { console.warn(e); } }
  clientHandle(msg);
}
function hostLobby(){ hostSend({ t: 'lobby', players: NET.players, settings: NET.settings, code: NET.code }); }
function hostOnData(conn, m){
  const id = conn.peer;
  if (!m || typeof m !== 'object') return;
  if (m.t === 'hello') {
    const fail = text => { conn.send({ t: 'error', msg: text }); setTimeout(() => conn.close(), 600); };
    if (H.phase !== 'lobby') return fail('Das Spiel läuft schon. Warte, bis der Host zur Lobby zurückkehrt, und tritt dann nochmal bei.');
    if (NET.players.length >= 8) return fail('Der Raum ist voll (max. 8 Spieler).');
    let name = String(m.player && m.player.name || 'Gast').slice(0, 16), k = 2;
    while (NET.players.some(p => p.name === name)) name = String(m.player.name).slice(0, 13) + ' ' + k++;
    const used = new Set(NET.players.map(p => p.color));
    const color = used.has(m.player.color) ? (COLORS.find(c => !used.has(c)) || m.player.color) : m.player.color;
    NET.conns.set(id, conn);
    NET.players = NET.players.filter(p => p.id !== id).concat({ id, name, color, emoji: String(m.player.emoji || '🙂').slice(0, 4) });
    return hostLobby();
  }
  if (m.t === 'take' && H.phase === 'record' && m.r === H.r && NET.players.some(p => p.id === id)) {
    H.takes[id] = m.data; return hostStatus();
  }
  if (m.t === 'vote' && H.phase === 'showcase' && m.r === H.r && m.for !== id) {
    if (m.for) H.votes[id] = m.for; else delete H.votes[id];
    return hostSend({ t: 'votes', n: Object.keys(H.votes).length });
  }
}
function hostDrop(id){
  if (!NET.conns.has(id)) return;
  NET.conns.delete(id);
  NET.players = NET.players.filter(p => p.id !== id);
  if (H.phase === 'lobby') return hostLobby();
  hostSend({ t: 'players', players: NET.players });
  if (H.phase === 'record') hostStatus();
}
function hostStatus(){
  const done = Object.keys(H.takes);
  hostSend({ t: 'status', done });
  if (NET.players.every(p => H.takes[p.id])) hostShowcase();
}
function hostStart(){
  H.deck = [...clips].sort(() => Math.random() - 0.5).slice(0, NET.settings.rounds);
  H.n = H.deck.length; H.r = 0;
  H.total = Object.fromEntries(NET.players.map(p => [p.id, 0]));
  hostNextRound();
}
function hostNextRound(){
  H.r++; H.takes = {}; H.votes = {}; H.phase = 'record';
  const clip = { ...H.deck[H.r - 1] }; delete clip.id;
  hostSend({ t: 'round', r: H.r, n: H.n, clip, players: NET.players, settings: NET.settings });
}
function hostShowcase(){
  if (H.phase !== 'record') return;
  H.phase = 'showcase';
  hostSend({ t: 'showcase', r: H.r, takes: H.takes, players: NET.players });
}
function hostReveal(){
  if (H.phase !== 'showcase') return;
  H.phase = 'reveal';
  const count = {};
  for (const v of Object.values(H.votes)) count[v] = (count[v] || 0) + 1;
  const max = Math.max(0, ...Object.values(count));
  const funny = max > 0 ? Object.keys(count).filter(id => count[id] === max) : [];
  const pts = {};
  for (const p of NET.players) {
    const d = H.takes[p.id];
    pts[p.id] = takePoints(d && !d.skipped ? d : null, funny.includes(p.id));
    H.total[p.id] = (H.total[p.id] || 0) + pts[p.id];
  }
  hostSend({ t: 'reveal', r: H.r, pts, funny, total: H.total, last: H.r >= H.n });
}
function hostNext(){
  if (H.phase !== 'reveal') return;
  if (H.r < H.n) return hostNextRound();
  H.phase = 'final';
  hostSend({ t: 'final', total: H.total, players: NET.players });
}
function hostBackToLobby(){ H.phase = 'lobby'; hostLobby(); }

/* ---------- Gast ---------- */
async function joinRoom(code, profile){
  const peer = await openPeer(null);
  const conn = peer.connect(peerIdFor(code), { reliable: true });
  await new Promise((res, rej) => {
    const t = setTimeout(() => rej(new Error('Raum „' + code + '“ nicht erreichbar. Stimmt der Code?')), 12000);
    conn.on('open', () => { clearTimeout(t); res(); });
    peer.on('error', e => { clearTimeout(t); rej(e.type === 'peer-unavailable' ? new Error('Raum „' + code + '“ nicht gefunden.') : e); });
  }).catch(e => { try { peer.destroy(); } catch {} throw e; });
  Object.assign(NET, { role: 'guest', peer, hostConn: conn, code });
  conn.on('data', m => clientHandle(m));
  conn.on('close', () => { if (NET.role === 'guest') onlineMessage('Verbindung beendet', 'Der Host hat den Raum verlassen oder die Verbindung ist abgebrochen.'); });
  conn.send({ t: 'hello', player: profile });
  panel(`<div class="card center"><div class="spinner"></div><h3>Verbunden – warte auf den Host …</h3></div>`);
}
function netSend(msg){
  if (isHost()) hostOnData({ peer: 'host', send(){}, close(){} }, msg);
  else if (NET.hostConn && NET.hostConn.open) NET.hostConn.send(msg);
}

/* ---------- Was jedes Gerät (auch der Host) bei einer Nachricht tut ---------- */
function clientHandle(m){
  if (!m || typeof m !== 'object') return;
  switch (m.t) {
    case 'lobby': NET.players = m.players; NET.settings = m.settings; NET.code = m.code; return renderOnlineLobby();
    case 'error': return onlineMessage('Beitreten nicht möglich', esc(m.msg));
    case 'round': NET.players = m.players; NET.settings = m.settings; return clientRound(m);
    case 'status': NET.status = m.done; return updateWaiting();
    case 'players': NET.players = m.players; return updateWaiting();
    case 'showcase': NET.players = m.players; return clientShowcase(m);
    case 'votes': { const el = $('#votecount'); if (el) el.textContent = m.n; return; }
    case 'reveal': return clientReveal(m);
    case 'final': return clientFinal(m);
  }
}

let lobbyShown = false;
function renderOnlineLobby(){
  const tok = newToken(); showVideo(false);
  const link = inviteLink(NET.code), host = isHost(), me = myId();
  panel(`<div class="card center">
    <div class="kicker">Online-Raum</div>
    <div class="roomcode">${esc(NET.code)}</div>
    ${host ? `<p class="hint">Schick deinen Freunden diesen Einladungslink:</p>
      <div class="invite"><input readonly id="invlink" value="${esc(link)}"><button data-choice="copy" id="copybtn">📋 Kopieren</button></div>
      ${navigator.share ? '<button class="sec small" data-choice="share">📤 Teilen …</button>' : ''}`
      : '<p class="hint">Du bist drin! Warte, bis der Host das Spiel startet.</p>'}
    <h3 style="margin-top:18px">Spieler (${NET.players.length}/8)</h3>
    <div class="chips">${NET.players.map(p => `<span class="chip">${avatar(p)} ${esc(p.name)}${p.id === 'host' ? ' 👑' : ''}${p.id === me ? ' <span class="hint">(du)</span>' : ''}</span>`).join('')}</div>
    ${host ? `<div class="row" style="margin-top:10px;align-items:flex-end;text-align:left">
        <div><label>Runden</label><div class="stepper"><button class="sec" data-choice="r-">−</button><b>${NET.settings.rounds}</b><button class="sec" data-choice="r+">+</button><span class="hint">von ${clips.length} Clips</span></div></div>
        <div><button class="switch ${NET.settings.showTitle ? 'on' : ''}" data-choice="title"><i></i> Titel als Hinweis zeigen</button></div>
      </div>
      <button class="big" data-choice="start" style="margin-top:14px">SPIEL STARTEN</button>`
      : `<div class="hint" style="margin-top:8px">Runden: ${NET.settings.rounds} · Titel-Hinweis: ${NET.settings.showTitle ? 'an' : 'aus'}</div><div class="spinner"></div>`}
    <br><button class="sec small" data-choice="leave">Raum verlassen</button>
  </div>`, !lobbyShown);
  lobbyShown = true;
  (async () => {
    try {
      while (true) {
        const ch = await G(choose(), tok);
        if (ch === 'leave') { lobbyShown = false; leaveOnline(); return renderHome(); }
        if (ch === 'copy') {
          try { await navigator.clipboard.writeText(link); } catch { $('#invlink').select(); document.execCommand('copy'); }
          $('#copybtn').textContent = '✓ Kopiert!'; continue;
        }
        if (ch === 'share') { try { await navigator.share({ title: 'Meme Catcher', text: 'Spiel mit mir Meme Catcher!', url: link }); } catch {} continue; }
        if (ch === 'r-' || ch === 'r+') { NET.settings.rounds = clamp(NET.settings.rounds + (ch === 'r+' ? 1 : -1), 1, clips.length); return hostLobby(); }
        if (ch === 'title') { NET.settings.showTitle = !NET.settings.showTitle; return hostLobby(); }
        if (ch === 'start') { lobbyShown = false; return hostStart(); }
      }
    } catch (e) { if (e !== STALE) throw e; }
  })();
}

async function clientRound(m){
  const tok = newToken();
  const clip = m.clip, head = roundHead(clip, m.r, m.n, m.settings);
  NET.cur = { clip, r: m.r, n: m.n, head, takes: {} }; NET.status = [];
  const me = NET.players.find(p => p.id === myId()) || { name: '?', emoji: '🙂', color: COLORS[0] };
  try {
    showVideo(false);
    panel(introHTML(clip, m.r, m.n, m.settings));
    beep(220, 0.25, 'sawtooth', 0.04);
    await G(choose(), tok);
    showVideo(true);
    panel(`<div class="card center">${head}
      <div class="turn" style="justify-content:center">${avatar(me, 'lg')}<div style="text-align:left"><div class="kicker">Deine Wahl</div><h2>${esc(me.name)}</h2></div></div>
      <div class="modes">
        <button class="mode" data-choice="memory"><span class="t">🧠 Aus dem Gedächtnis</span><span class="d">Original nicht anhören – Punkte ×1,5</span></button>
        <button class="mode sec" data-choice="listen"><span class="t">👂 Erst anhören</span><span class="d">Original einmal anhören – Punkte ×1</span></button>
      </div></div>`);
    let mode = await G(choose(), tok);
    if (mode === 'listen') {
      try { await listenOriginal(clip, head, '👂 Hör genau hin …', tok); } catch (e) { if (e === STALE) throw e; }
    }
    const take = await doTurn(clip, head, me, mode, tok);
    let data = { skipped: true };
    if (take) {
      panel(`<div class="card center">${head}<div class="spinner"></div><h3>Auswertung läuft …</h3></div>`);
      await G(analyzeTake(clip, take), tok);
      data = { mode: take.mode, help: take.help, transcript: take.transcript, s: take.s, prof: take.prof,
               audio: await take.blob.arrayBuffer(), mime: take.blob.type };
      URL.revokeObjectURL(take.url);
    }
    ensure(tok);
    netSend({ t: 'take', r: m.r, data });
    renderWaiting(tok);
  } catch (e) { if (e !== STALE) { console.error(e); panel(`<div class="card center"><div class="err">${esc(e.message || e)}</div></div>`); } }
}

function waitListHTML(){
  return NET.players.map(p => `<span class="chip ${NET.status.includes(p.id) ? 'on' : ''}">${avatar(p)} ${esc(p.name)} ${NET.status.includes(p.id) ? '✓' : '⏳'}</span>`).join('');
}
function renderWaiting(tok){
  panel(`<div class="card center">${NET.cur.head}<h3>✓ Deine Aufnahme ist abgeschickt</h3>
    <p class="hint">Warte auf die anderen …</p>
    <div class="chips" id="waitlist">${waitListHTML()}</div>
    ${isHost() ? '<button class="sec" data-choice="skipwait">Nicht mehr warten ➜</button>' : ''}</div>`);
  (async () => {
    try { while (true) { const ch = await G(choose(), tok); if (ch === 'skipwait') hostShowcase(); } }
    catch (e) { if (e !== STALE) throw e; }
  })();
}
function updateWaiting(){ const el = $('#waitlist'); if (el) el.innerHTML = waitListHTML(); }

async function clientShowcase(m){
  const tok = newToken(), cur = NET.cur;
  for (const t of Object.values(cur.takes)) URL.revokeObjectURL(t.url);
  cur.takes = {};
  for (const [id, d] of Object.entries(m.takes || {}))
    if (d && !d.skipped && d.audio) cur.takes[id] = { ...d, url: URL.createObjectURL(new Blob([d.audio], { type: d.mime || 'audio/webm' })) };
  const footer = isHost()
    ? `<p class="hint"><span id="votecount">0</span> / ${NET.players.length} haben abgestimmt</p><button class="big" data-choice="reveal">🎬 ORIGINAL AUFDECKEN</button>`
    : '<p class="hint">Stimm ab! Der Host deckt gleich das Original auf …</p>';
  try {
    const r = await showcaseLoop(cur.clip, cur.head, NET.players, cur.takes, {
      exclude: myId(), canVote: NET.players.length > 1,
      onVote: id => netSend({ t: 'vote', r: cur.r, for: id }), footer }, tok);
    if (r === 'reveal' && isHost()) hostReveal();
  } catch (e) { if (e !== STALE) throw e; }
}

async function clientReveal(m){
  const tok = newToken(), cur = NET.cur;
  try {
    showVideo(true);
    await revealOriginal(cur.clip, cur.head, tok);
    const footer = isHost()
      ? `<button class="big" data-choice="next">${m.last ? 'ZUM ENDSTAND 🏆' : 'NÄCHSTE RUNDE ➜'}</button>`
      : '<p class="hint">Warte auf den Host …</p>';
    const ch = await resultsLoop(cur.clip, cur.head, NET.players, cur.takes, m.pts, m.funny || [], m.total, footer, tok);
    if (ch === 'next' && isHost()) hostNext();
  } catch (e) { if (e !== STALE) throw e; }
}

async function clientFinal(m){
  const tok = newToken();
  NET.players = m.players;
  renderFinal(m.players, m.total, isHost()
    ? '<button class="big" data-choice="lobby">ZURÜCK ZUR LOBBY</button><br><button class="sec" data-choice="leave">Raum schließen</button>'
    : '<p class="hint">Der Host kann eine neue Runde starten.</p><button class="sec" data-choice="leave">Raum verlassen</button>');
  try {
    const ch = await G(choose(), tok);
    if (ch === 'lobby') hostBackToLobby();
    else { leaveOnline(); renderHome(); }
  } catch (e) { if (e !== STALE) throw e; }
}

/* ============================================================
   Start
   ============================================================ */
(async () => {
  $('#soundbtn').textContent = soundOn ? '🔊' : '🔇';
  if (!clips.length && !localStorage.getItem('memecatcher.starterLoaded')) {
    try { await loadStarter(); localStorage.setItem('memecatcher.starterLoaded', '1'); } catch {}
  }
  const room = new URLSearchParams(location.search).get('room');
  if (room) renderOnline(room.toUpperCase().slice(0, 5)); else renderHome();
})();
</script>
